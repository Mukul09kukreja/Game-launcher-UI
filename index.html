<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Game UI</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="18" fill="currentColor" class="bi" viewBox="0 0 16 16">
            <path d="m.334 0 4.358 4.359h7.15v7.15l4.358 4.358V0zM.2 9.72l4.487-4.488v6.281h6.28L6.48 16H.2z"/>
        </svg>
        <div class="web-name">
            <button class="title">GameHub</button>
        </div>
        <div class="nav-bar-search">
            <input class="search" type="text" placeholder="Search">
        </div>
        <div class="nav-bar-home">
            <button class="Home_title">Home</button>
        </div>
        <div class="nav-bar-store">
            <button class="Store">Store</button>
        </div>
        <div class="nav-bar-library">
            <button class="Library">Library</button>
        </div>
        <div class="nav-bar-stats">
            <button class="Stats">Stats</button>
        </div>
        <div class="nav-bar-setting">
            <button class="Setting">Setting</button>
        </div>
        <div class="Home">
            Welcome to my website purchase from store and enjoy your game
        </div>
        <div>
            <div class="game1">
                 <img class="gta" src="Grand Theft Auto V.jpg">
                <a class="Gta5" href="https://store.rockstargames.com/game/buy-grand-theft-auto-v">Buy GTA 5</a>
            </div>
            <div class="game2">
                <img class="val" src="valorant agents.jpg">
                <a class="valorant">valorant</a>
            </div>
            <div class="game3">
                <img class="lol" src="download.jpg">
                <a class="league">league of legend</a>
            </div>
        </div>
    </body>
</html>
